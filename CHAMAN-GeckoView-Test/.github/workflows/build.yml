name: Build CHAMAN GeckoView Test APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build ARM64 test APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Copy APK
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)
          test -n "$APK"
          cp "$APK" CHAMAN-GeckoView-Test-ARM64.apk

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: CHAMAN-GeckoView-Test-ARM64
          path: CHAMAN-GeckoView-Test-ARM64.apk
          if-no-files-found: error
          retention-days: 14
