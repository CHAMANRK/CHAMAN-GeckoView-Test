name: Build CHAMAN GeckoView Test APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest already ships the Android SDK (ANDROID_HOME set).
      # android-actions/setup-android was removed: it tried to install the
      # obsolete `tools` package and sdkmanager failed with exit code 1.
      - name: Install Android SDK packages
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then
            SDKM=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          fi
          echo "Using sdkmanager: $SDKM"
          test -x "$SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platform-tools" "platforms;android-35" "platforms;android-36" "build-tools;35.0.0" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Build ARM64 test APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace --console=plain

      - name: Copy APK
        run: |
          APK=$(find app/build/outputs/apk/release -name '*arm64-v8a*release*.apk' | head -n 1)
          test -n "$APK"
          cp "$APK" CHAMAN-GeckoView-Test-ARM64.apk

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: CHAMAN-GeckoView-Test-ARM64
          path: CHAMAN-GeckoView-Test-ARM64.apk
          if-no-files-found: error
          retention-days: 14
