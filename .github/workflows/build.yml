name: Build CHAMAN GeckoView Test APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest already ships the Android SDK (ANDROID_HOME set).
      - name: Install Android SDK packages
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then
            SDKM=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          fi
          echo "Using sdkmanager: $SDKM"
          test -x "$SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platform-tools" "platforms;android-35" "build-tools;36.0.0"
          # compileSdk 37 platform: best effort (AGP can also auto-download it)
          "$SDKM" --list 2>/dev/null | grep -E "platforms;android-(36|37)" || true
          "$SDKM" --install "platforms;android-37.0" || "$SDKM" --install "platforms;android-37" || echo "WARN: could not pre-install android-37 platform"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Prepare signing key
        env:
          KS_B64: ${{ secrets.CHAMAN_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.CHAMAN_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/chaman-release.jks"
            echo "CHAMAN_KEYSTORE_FILE=$RUNNER_TEMP/chaman-release.jks" >> "$GITHUB_ENV"
            echo "CHAMAN_KEYSTORE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
            echo "CHAMAN_KEY_ALIAS=chaman" >> "$GITHUB_ENV"
            echo "SIGNING=chaman permanent key" >> "$GITHUB_ENV"
          else
            echo "::warning::Signing secrets nahi mile, debug key use hogi. Downloader is APK ko reject karega (signature match nahi)."
            echo "SIGNING=debug key (fallback)" >> "$GITHUB_ENV"
          fi

      - name: Build ARM64 test APK
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon --stacktrace --console=plain 2>&1 | tee build.log

      - name: Show dependency/AAR errors in summary
        if: failure()
        run: |
          {
            echo "### Build errors (copy from here)"
            echo '```'
            grep -n -B1 -A8 -E "Dependency '|issues? (was|were) found|What went wrong|Could not (resolve|find)|Unsupported|incompatible" build.log | head -n 150
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Copy APK
        run: |
          APK=$(find app/build/outputs/apk/release -name '*arm64-v8a*release*.apk' | head -n 1)
          test -n "$APK"
          cp "$APK" CHAMAN-GeckoView-Test-ARM64.apk
          # Fixed name: Downloader downloads releases/latest/download/CHAMAN-Cookie-Browser.apk
          cp "$APK" CHAMAN-Cookie-Browser.apk
          echo "signing: $SIGNING"

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: CHAMAN-GeckoView-Test-ARM64
          path: CHAMAN-GeckoView-Test-ARM64.apk
          if-no-files-found: error
          retention-days: 14

      # Tag push (v*) publishes the APK as a GitHub Release so Downloader can install it.
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$GITHUB_REF_NAME"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" CHAMAN-Cookie-Browser.apk --clobber
          else
            gh release create "$TAG" CHAMAN-Cookie-Browser.apk --title "CHAMAN Cookie Browser $TAG" --notes "signing: $SIGNING"
          fi
